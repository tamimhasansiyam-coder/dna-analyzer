name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet and Build APK
        run: |
          pip install flet
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DNA-Analyzer-Flet-APK
          path: build/apk/*.apk
